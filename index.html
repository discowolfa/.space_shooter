<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#07101f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>FRONTIER · Space Shooter</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <span class="brand">F<span>✦</span>RONTIER</span>
        <div class="preferences">
          <select id="language" aria-label="Language">
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="ru">RU</option></select
          ><button id="sound" aria-label="Sound">♪</button
          ><button id="update" hidden>↻</button>
        </div>
      </header>
      <main class="arena">
        <div id="game" aria-label="Space Shooter"></div>
        <div id="overlay">
          <section class="menu-card" aria-labelledby="menu-title">
            <div class="menu-top">
              <span class="eyebrow">SPACE COMMAND</span
              ><span id="balance"></span>
            </div>
            <div id="menu-scroll"><section id="panel"></section></div>
            <div class="menu-bottom">
              <button id="back"></button><small>v0.1.0 α · FRONTIER</small>
            </div>
          </section>
        </div>
        <div id="toast" role="status" hidden></div>
      </main>
      <footer class="controls">
        <button id="pause">☰</button><span id="hint"></span
        ><button id="bomb">✦</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
